name: CI

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  database-and-e2e:
    name: RLS tests and E2E (local Supabase)
    runs-on: ubuntu-latest
    needs: checks
    env:
      APP_ENV: local
      INTEGRATIONS_MODE: fake
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database, auth, API, storage)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,mailpit
      - name: Export Supabase settings
        run: |
          pnpm exec supabase status -o env \
            | sed -n 's/^API_URL="\(.*\)"/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^ANON_KEY="\(.*\)"/NEXT_PUBLIC_SUPABASE_ANON_KEY=\1/p; s/^DB_URL="\(.*\)"/DATABASE_URL=\1/p' >> "$GITHUB_ENV"
          # The local-only hook secret lives in supabase/config.toml.
          echo "SEND_SMS_HOOK_SECRET=$(sed -n '/\[auth.hook.send_sms\]/,/secrets/ s/^secrets = "\(.*\)"/\1/p' supabase/config.toml)" >> "$GITHUB_ENV"
      - run: pnpm test:rls
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
