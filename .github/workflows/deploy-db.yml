# Applies database migrations to the hosted Supabase projects. Matches how Vercel deploys:
# a pull request (Vercel preview) → staging database; merge to main (Vercel production) → production
# database. Migrations must stay backwards compatible because the app and the migration land at about
# the same time (docs/RUNBOOK.md §2). Require a reviewer on the "production" GitHub environment to
# make production migrations wait for a click.
# Needs repository secrets SUPABASE_ACCESS_TOKEN, plus per GitHub environment ("staging",
# "production"): SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD. Skips quietly until they exist.
name: Deploy database

on:
  pull_request:
    branches: [main]
    paths: ["supabase/migrations/**"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "staging or production"
        required: true
        default: staging

concurrency:
  group: deploy-db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'push' && 'production' || 'staging') }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets not set for this environment; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cfg.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Link project
        if: steps.cfg.outputs.skip != 'true'
        run: pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        if: steps.cfg.outputs.skip != 'true'
        run: pnpm exec supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: steps.cfg.outputs.skip != 'true'
        run: pnpm exec supabase db push --password "$SUPABASE_DB_PASSWORD"
